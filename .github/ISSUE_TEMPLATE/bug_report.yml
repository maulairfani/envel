name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please do **not** include secrets
        (tokens, passwords, `JWT_SECRET`, DB credentials) in this report.
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - mcp-server
        - auth-server
        - agent
        - web
        - deployment / docker-compose
        - not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant log output (redact secrets). This is rendered as code.
      render: shell
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, deployment method (docker compose / langgraph dev), commit SHA.
    validations:
      required: true
