name: envel

# Each app is self-contained: its own .env is the interpolation source for its
# compose file (so POSTGRES_* etc. live in that app's .env, not a root .env).
include:
  - path: ./apps/auth-server/docker-compose.yml
    env_file: ./apps/auth-server/.env
  - path: ./apps/mcp-server/docker-compose.yml
    env_file: ./apps/mcp-server/.env
  - path: ./apps/agent/docker-compose.yml
    env_file: ./apps/agent/.env
  # web needs no per-app .env: its config is fixed internal service URLs set
  # inline in `environment:`, and ENVEL_TAG comes from the deploy shell.
  - path: ./apps/web/docker-compose.yml
