services:
  mcp-server:
    image: ghcr.io/maulairfani/envel-mcp:${ENVEL_TAG:-latest}
    build: .
    container_name: envel-mcp
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      postgres-managed:
        condition: service_healthy
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - envel
    restart: unless-stopped

  postgres-managed:
    image: postgres:16-alpine
    container_name: envel-postgres-managed
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - managed-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - envel
    restart: unless-stopped

volumes:
  managed-pg-data:

networks:
  envel:
    name: envel
