services:
  auth-server:
    image: ghcr.io/maulairfani/envel-auth:${ENVEL_TAG:-latest}
    build: .
    container_name: envel-auth
    ports:
      - "9001:9000"
    env_file:
      - .env
    depends_on:
      postgres-auth:
        condition: service_healthy
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "9000"]
    networks:
      - envel
    restart: unless-stopped

  postgres-auth:
    image: postgres:16-alpine
    container_name: envel-postgres-auth
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - auth-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - envel
    restart: unless-stopped

volumes:
  auth-pg-data:

networks:
  envel:
    name: envel
