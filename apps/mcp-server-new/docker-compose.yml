services:
  mcp-server:
    build: .
    container_name: envel-mcp-new
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MANAGED_DATABASE_URL: postgresql://${POSTGRES_USER:-envel}:${POSTGRES_PASSWORD:-envel}@postgres-managed:5432/${POSTGRES_DB:-envel_managed}
    depends_on:
      postgres-managed:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    networks:
      - envel
    restart: unless-stopped

  postgres-managed:
    image: postgres:16-alpine
    container_name: envel-postgres-managed
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-envel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-envel}
      POSTGRES_DB: ${POSTGRES_DB:-envel_managed}
    ports:
      - "5433:5432"
    volumes:
      - managed-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-envel} -d ${POSTGRES_DB:-envel_managed}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - envel
    restart: unless-stopped

volumes:
  managed-pg-data:

networks:
  envel:
    name: envel
